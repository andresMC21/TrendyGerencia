# Pruebas de Trendy en cada push y pull request a main y develop.
# API: lint, migraciones, pruebas unitarias con cobertura (umbral 80 %),
# pruebas de integración contra PostgreSQL + PostGIS y compilación.
# Web: lint y compilación.
name: tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (back/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: trendy
          POSTGRES_PASSWORD: trendy
          POSTGRES_DB: trendy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U trendy -d trendy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://trendy:trendy@localhost:5432/trendy_test
      DB_SSL: 'false'
      JWT_SECRET: ci-test-secret
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: back/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run migration:run
      - run: npm run test:cov
      - run: npm run test:e2e
      - run: npm run build

  web:
    name: Web (web/)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

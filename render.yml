# Despliegue en Render (Blueprint). Render despliega la rama `main`:
# para publicar el sprint hay que llevar develop a main con un PR.
databases:
  - name: trendy-gerencia-db
    databaseName: trendy
    user: trendy
    plan: free
    region: oregon

services:
  # API (NestJS). Al arrancar aplica las migraciones; TypeORM crea las
  # extensiones uuid-ossp y postgis si faltan.
  - type: web
    name: trendy-gerencia-api
    runtime: node
    rootDir: back
    plan: free
    region: oregon
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci --include=dev && npm run build
    # Entorno de demostración: carga los datos de prueba en cada arranque.
    startCommand: npm run migration:run:prod && node dist/seed/seed.js && npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: DATABASE_URL
        fromDatabase:
          name: trendy-gerencia-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: DB_SSL
        value: 'false'
      - key: TYPEORM_SYNCHRONIZE
        value: 'false'

  # Página web (React + Vite) como sitio estático.
  - type: web
    name: trendy-gerencia-web
    runtime: static
    rootDir: web
    branch: main
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    # React Router: cualquier ruta (/producto/:id, /transacciones/:id…) sirve index.html.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: VITE_API_URL
        value: https://trendy-gerencia-api.onrender.com/api
